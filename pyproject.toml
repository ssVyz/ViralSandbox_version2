[project]
name = "viral-sandbox"
version = "0.2.1"
description = "An educational simulation game where players configure and evolve a virus to infect cells."
readme = "README.md"
requires-python = ">=3.10"

# No third-party dependencies: the game runs entirely on the standard library
# (tkinter, json, dataclasses, pathlib, ...). Add runtime deps here if that changes.
dependencies = []

[tool.uv]
# This is a run-in-place application, not an installable library.
#
# settings.py and main.py resolve `settings.json` / `default_database.json`
# relative to `__file__`, so the app must run from the source tree. Installing it
# into site-packages would send those reads and writes into .venv instead.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Flat layout: the modules live at the repo root, so put it on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
